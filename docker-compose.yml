name: circle-router

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  # ── Прозрачный прокси. TPROXY-инбаунд + VLESS/VMess/Trojan/SS-аутбаунд ──────
  xray:
    build:
      context: ./services/xray
      args:
        XRAY_VERSION: ${XRAY_VERSION:-v26.3.27}
    image: circle-router/xray:${XRAY_VERSION:-v26.3.27}
    container_name: ${CR_XRAY_CONTAINER:-circle-xray}
    restart: unless-stopped
    network_mode: host
    cap_add:
      - NET_ADMIN        # IP_TRANSPARENT для TPROXY-сокета
      - NET_BIND_SERVICE
    volumes:
      - ./data/xray:/etc/xray
      - ./data/geo:/usr/share/xray
      - ./data/logs/xray:/var/log/xray
    logging: *logging
    healthcheck:
      test: ["CMD", "/usr/local/bin/xray", "api", "statsquery", "--server=127.0.0.1:10085", "-pattern="]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s

  # ── DHCP + DNS для LAN ─────────────────────────────────────────────────────
  dnsmasq:
    build: ./services/dnsmasq
    image: circle-router/dnsmasq:latest
    container_name: ${CR_DNSMASQ_CONTAINER:-circle-dnsmasq}
    restart: unless-stopped
    network_mode: host
    cap_add:
      - NET_ADMIN
      - NET_BIND_SERVICE
      - NET_RAW
    volumes:
      - ./data/dnsmasq:/etc/dnsmasq
      - ./data/logs/dnsmasq:/var/log/dnsmasq
    logging: *logging

  # ── Мозг: REST API, веб-панель, nftables/ip-роутинг, PPPoE, watchdog ───────
  controller:
    build:
      context: .
      dockerfile: services/controller/Dockerfile
      args:
        XRAY_VERSION: ${XRAY_VERSION:-v26.3.27}
    image: circle-router/controller:latest
    container_name: circle-controller
    restart: unless-stopped
    network_mode: host
    # privileged нужен целиком, а не отдельными caps: контроллер правит
    # sysctl'ы хоста (/proc/sys монтируется ro во всё, кроме privileged),
    # грузит модули ядра (nf_tproxy, pppoe) и держит /dev/ppp для pppd.
    privileged: true
    environment:
      CR_DATA: /data
      CR_HTTP_PORT: ${CR_HTTP_PORT:-8088}
      CR_ADMIN_USER: ${CR_ADMIN_USER:-admin}
      CR_ADMIN_PASSWORD_HASH: ${CR_ADMIN_PASSWORD_HASH:?set CR_ADMIN_PASSWORD_HASH in .env}
      CR_SECRET_KEY: ${CR_SECRET_KEY:?set CR_SECRET_KEY in .env}
      CR_XRAY_CONTAINER: ${CR_XRAY_CONTAINER:-circle-xray}
      CR_DNSMASQ_CONTAINER: ${CR_DNSMASQ_CONTAINER:-circle-dnsmasq}
      CR_WAN_IF: ${CR_WAN_IF:-enp2s0}
      CR_LAN_IF: ${CR_LAN_IF:-enp1s0}
      CR_LAN_ADDRESS: ${CR_LAN_ADDRESS:-192.168.10.1}
      CR_LAN_PREFIX: ${CR_LAN_PREFIX:-24}
      CR_HOST_ROOT: /hostfs
    volumes:
      - ./data:/data
      - /var/run/docker.sock:/var/run/docker.sock
      - /lib/modules:/lib/modules:ro
      - /etc/systemd/network:/host/systemd-network
      # Корень хоста только на чтение: без него не видно занятость его файловых
      # систем — /proc и /sys общие, а точки монтирования у контейнера свои.
      # Отдельный каталог, а не /host: внутрь read-only бинда корня Docker не
      # сможет создать точку для соседнего монтирования и не запустит контейнер.
      - /:/hostfs:ro
    logging: *logging
